                LỊCH TUẦN NÀY
              </h2>
              <button
                onClick={() => updatePlan(null)}
                style={{
                  background: "none",
                  border: `1px solid ${C.border}`,
                  borderRadius: 8,
                  padding: "5px 12px",
                  color: C.muted,
                  fontSize: 12,
                }}
              >
                Tạo lại ↻
              </button>
            </div>
            {planDays.map((day, i) => (
              <div
                key={i}
                style={{
                  background: day.rest ? C.surface : C.card,
                  border: `1px solid ${C.border}`,
                  borderLeft: `3px solid ${day.rest ? C.border : C.accent}`,
                  borderRadius: 14,
                  marginBottom: 10,
                  overflow: "hidden",
                }}
              >
                <div
                  style={{
                    padding: "12px 16px",
                    display: "flex",
                    justifyContent: "space-between",
                    alignItems: "center",
                  }}
                >
                  <div
                    style={{ display: "flex", alignItems: "center", gap: 10 }}
                  >
                    <span
                      style={{
                        fontFamily: "'Barlow Condensed',sans-serif",
                        fontSize: 19,
                        fontWeight: 700,
                        color: day.rest ? C.muted : C.text,
                      }}
                    >
                      {day.day}
                    </span>
                    <span
                      style={{
                        fontSize: 13,
                        color: day.rest ? C.muted : C.accent,
                        fontWeight: 500,
                      }}
                    >
                      {day.rest ? "Nghỉ ngơi" : day.focus}
                    </span>
                  </div>
                  {!day.rest && (
                    <span style={{ fontSize: 12, color: C.muted }}>
                      {day.duration}
                    </span>
                  )}
                </div>
                {!day.rest && day.exercises?.length > 0 && (
                  <div style={{ borderTop: `1px solid ${C.border}` }}>
                    {day.exercises.map((ex, j) => (
                      <div
                        key={j}
                        style={{
                          padding: "9px 16px",
                          display: "flex",
                          justifyContent: "space-between",
                          alignItems: "center",
                          borderBottom:
                            j < day.exercises.length - 1
                              ? `1px solid ${C.border}`
                              : "none",
                        }}
                      >
                        <div style={{ flex: 1, marginRight: 10 }}>
                          <div
                            style={{
                              fontSize: 13,
                              color: C.text,
                              fontWeight: 500,
                            }}
                          >
                            {ex.name}
                          </div>
                          {ex.note && (
                            <div
                              style={{
                                fontSize: 11,
                                color: C.muted,
                                marginTop: 2,
                              }}
                            >
                              {ex.note}
                            </div>
                          )}
                        </div>
                        <span
                          style={{
                            fontSize: 13,
                            color: C.accent,
                            fontWeight: 700,
                            flexShrink: 0,
                          }}
                        >
                          {ex.sets}
                        </span>
                      </div>
                    ))}
                  </div>
                )}
              </div>
            ))}
          </div>
        );
      }

      // ════════════════════════════════════════════════════════════════
      // PHẦN 3: HEALTH CHECK-IN
      // ════════════════════════════════════════════════════════════════
      function HealthCheckin({ profile }) {
        const [energy, setEnergy] = useState(null);
        const [soreness, setSoreness] = useState(null);
        const [sleep, setSleep] = useState(null);
        const [symptoms, setSymptoms] = useState([]);
        const [advice, setAdvice] = useState("");
        const [loading, setLoading] = useState(false);
        const [submitted, setSubmitted] = useState(false);

        const ENERGY_OPTS = [
          { val: 1, icon: "😴", label: "Kiệt sức" },
          { val: 2, icon: "😔", label: "Mệt" },
          { val: 3, icon: "😐", label: "Bình thường" },
          { val: 4, icon: "😊", label: "Tốt" },
          { val: 5, icon: "🔥", label: "Rất tốt" },
        ];
        const SYMPTOM_LIST = [
          "😵 Chóng mặt",
          "💗 Tim đập nhanh",
          "🤢 Buồn nôn",
          "🦵 Đau cơ nặng",
          "😮‍💨 Khó thở",
          "💤 Mất ngủ",
          "🤕 Đau đầu",
          "🩹 Chấn thương mới",
        ];

        const getAdvice = async () => {
          setLoading(true);
          const prompt = `Người dùng vừa hoàn thành weekly health check-in:
- Năng lượng hôm nay: ${energy}/5
- Độ đau nhức cơ: ${soreness}/5  
- Chất lượng giấc ngủ: ${sleep}/5
- Triệu chứng: ${symptoms.length ? symptoms.join(", ") : "Không có"}
- Bệnh nền: ${profile.conditions?.join(", ") || "Không có"}
- Mục tiêu: ${profile.goal}

Dựa trên thông tin này, hãy đưa ra lời khuyên ngắn gọn (3-4 câu) về:
1. Có nên tập hôm nay không?
2. Nếu có thì tập gì, cường độ thế nào?
3. Có cần lo lắng gì về triệu chứng không?`;

          const reply = await askAI(
            [{ role: "user", content: prompt }],
            `Bạn là AI huấn luyện viên gym quan tâm đến sức khỏe người dùng. Trả lời tiếng Việt, thực tế, ngắn gọn. ${profile.conditions?.length ? "Người dùng có bệnh nền, hãy đặc biệt thận trọng." : ""}`,
          );
          setAdvice(reply);
          setLoading(false);
          setSubmitted(true);
        };

        const scoreCard = (title, val, setVal, color = "#AAFF00") => (
          <div style={{ marginBottom: 18 }}>
            <div style={{ ...label, marginBottom: 10 }}>{title}</div>
            <div style={{ display: "flex", gap: 8 }}>
              {[1, 2, 3, 4, 5].map((n) => (
                <button
                  key={n}
                  onClick={() => setVal(n)}
                  style={{
                    flex: 1,
                    padding: "10px 0",
                    background: val >= n ? color : "#14142A",
                    border: `1px solid ${val >= n ? color : C.border}`,
                    borderRadius: 10,
                    color: val >= n ? "#000" : C.muted,
                    fontWeight: 700,
                    fontSize: 15,
                    transition: "all 0.15s",
                  }}
                >
                  {n}
                </button>
              ))}
            </div>
            <div
              style={{
                display: "flex",
                justifyContent: "space-between",
                marginTop: 5,
                fontSize: 11,
                color: C.muted,
              }}
            >
              <span>Rất kém</span>
              <span>Xuất sắc</span>
            </div>
          </div>
        );

        if (submitted)
          return (
            <div style={{ padding: 16, overflowY: "auto" }}>
              <h2
                style={{
                  fontFamily: "'Barlow Condensed',sans-serif",
                  fontSize: 24,
                  fontWeight: 800,
                  color: C.text,
                  marginBottom: 4,
                }}
              >
                KẾT QUẢ CHECK-IN
              </h2>

              {/* Score summary */}
              <div
                style={{
                  display: "grid",
                  gridTemplateColumns: "1fr 1fr 1fr",
                  gap: 10,
                  marginBottom: 16,
                }}
              >
                {[
                  { label: "Năng lượng", val: energy, color: C.accent },
                  { label: "Cơ bắp", val: soreness, color: "#00E5CC" },
                  { label: "Giấc ngủ", val: sleep, color: "#3B82F6" },
                ].map((s) => (
                  <div
                    key={s.label}
                    style={{
                      background: C.card,
                      border: `1px solid ${C.border}`,
                      borderRadius: 12,
                      padding: "12px",
                      textAlign: "center",
                    }}
                  >
                    <div
                      style={{
                        fontFamily: "'Barlow Condensed',sans-serif",
                        fontSize: 32,
                        fontWeight: 900,
                        color: s.color,
                      }}
                    >
                      {s.val}/5
                    </div>
                    <div style={{ fontSize: 11, color: C.muted, marginTop: 2 }}>
                      {s.label}
                    </div>
                  </div>
                ))}
              </div>

              {/* AI advice */}
              <div
                style={{
                  background: C.card,
                  border: `1px solid ${C.accent}`,
                  borderRadius: 16,
                  padding: 16,
                  marginBottom: 16,
                }}
              >
                <div
                  style={{
                    display: "flex",
                    gap: 10,
                    marginBottom: 10,
                    alignItems: "center",
                  }}
                >
                  <div
                    style={{
                      width: 30,
                      height: 30,
                      borderRadius: "50%",
                      background: C.accent,
                      display: "flex",
                      alignItems: "center",
                      justifyContent: "center",
                      fontSize: 15,
                      flexShrink: 0,
                    }}
                  >
                    💪
                  </div>
                  <div
                    style={{ fontSize: 13, fontWeight: 600, color: C.accent }}
                  >
                    Lời khuyên từ AI Coach
                  </div>
                </div>
                <p
                  style={{
                    fontSize: 14,
                    color: C.text,
                    lineHeight: 1.7,
                    whiteSpace: "pre-wrap",
                  }}
                >
                  {advice}
                </p>
              </div>

              {/* Symptoms */}
              {symptoms.length > 0 && (
                <div
                  style={{
                    background: "#1A0A00",
                    border: `1px solid ${C.warn}`,
                    borderRadius: 12,
                    padding: "12px 16px",
                    marginBottom: 16,
                  }}
                >
                  <p style={{ fontSize: 12, color: C.warn, lineHeight: 1.5 }}>
                    ⚠️ Bạn có báo cáo: <strong>{symptoms.join(", ")}</strong>.
                    Nếu triệu chứng nghiêm trọng hoặc kéo dài, hãy đến gặp bác
                    sĩ.
                  </p>
                </div>
              )}

              <button
                onClick={() => {
                  setSubmitted(false);
                  setAdvice("");
                  setEnergy(null);
                  setSoreness(null);
                  setSleep(null);
                  setSymptoms([]);
                }}
                style={{
                  width: "100%",
                  padding: "13px",
                  background: C.card,
                  border: `1px solid ${C.border}`,
                  borderRadius: 14,
                  color: C.text,
                  fontSize: 14,
                  fontWeight: 600,
                }}
              >
                Check-in lại ↻
              </button>
            </div>
          );

        return (
          <div style={{ padding: 16, overflowY: "auto" }}>
            <h2
              style={{
                fontFamily: "'Barlow Condensed',sans-serif",
                fontSize: 24,
                fontWeight: 800,
                color: C.text,
                marginBottom: 4,
              }}
            >
              HEALTH CHECK-IN
            </h2>
            <p
              style={{
                color: C.muted,
                fontSize: 13,
                marginBottom: 20,
                lineHeight: 1.5,
              }}
            >
              Báo cáo tình trạng hôm nay để AI điều chỉnh lộ trình phù hợp
            </p>

            {scoreCard("⚡ NĂNG LƯỢNG HÔM NAY", energy, setEnergy, C.accent)}
            {scoreCard(
              "💪 ĐỘ ĐAU NHỨC CƠ BẮP",
              soreness,
              setSoreness,
              "#00E5CC",
            )}
            {scoreCard("😴 CHẤT LƯỢNG GIẤC NGỦ", sleep, setSleep, "#3B82F6")}

            <div style={label}>TRIỆU CHỨNG BẤT THƯỜNG (nếu có)</div>
            <div
              style={{
                display: "grid",
                gridTemplateColumns: "1fr 1fr",
                gap: 8,
                marginTop: 8,
                marginBottom: 20,
              }}
            >
              {SYMPTOM_LIST.map((s) => (
                <button
                  key={s}
                  onClick={() => toggleArr(symptoms, setSymptoms, s)}
                  style={{
                    ...chip(symptoms.includes(s), true),
                    justifyContent: "flex-start",
                    fontSize: 12,
                  }}
                >
                  {s}
                </button>
              ))}
            </div>

            {/* Danger alert for serious symptoms */}
            {(symptoms.includes("💗 Tim đập nhanh") ||
              symptoms.includes("😮‍💨 Khó thở") ||
              symptoms.includes("🤢 Buồn nôn")) && (
              <div
                style={{
                  background: "#1A0000",
                  border: `1px solid ${C.danger}`,
                  borderRadius: 12,
                  padding: "12px 16px",
                  marginBottom: 16,
                }}
              >
                <p style={{ fontSize: 13, color: C.danger, lineHeight: 1.5 }}>
                  🚨 Bạn có triệu chứng nghiêm trọng. Nếu khó chịu nhiều, hãy
                  nghỉ ngơi và liên hệ bác sĩ ngay. Không nên tập hôm nay.
                </p>
              </div>
            )}

            <button
              onClick={() => energy && soreness && sleep && getAdvice()}
              style={primBtn(energy && soreness && sleep)}
            >
              {loading ? "AI đang phân tích..." : "Nhận lời khuyên từ AI →"}
            </button>
          </div>
        );
      }

      // Helper for symptoms toggle
      function toggleArr(arr, setArr, val) {
        arr.includes(val)
          ? setArr(arr.filter((x) => x !== val))
          : setArr([...arr, val]);
      }

      // ════════════════════════════════════════════════════════════════
      // NUTRITION (giữ nguyên)
      // ════════════════════════════════════════════════════════════════
      function Nutrition({ profile }) {
        const [view, setView] = useState("home");
        const [q, setQ] = useState("");
        const [ans, setAns] = useState("");
        const [loading, setLoading] = useState(false);
        const [tip, setTip] = useState("");
        const [tipLoad, setTipLoad] = useState(false);
        const [food, setFood] = useState("");
        const [cals, setCals] = useState("");
        const [meals, setMeals] = useState([]);

        useEffect(() => {
          setTipLoad(true);
          askAI(
            [
              {
                role: "user",
                content: `1 mẹo dinh dưỡng quan trọng nhất cho người mục tiêu ${profile.goal}, ${profile.conditions?.length ? "bệnh nền: " + profile.conditions.join(", ") : ""} tập ${profile.days} buổi/tuần. Chỉ 2 câu.`,
              },
            ],
            "Chuyên gia dinh dưỡng thể thao. Tiếng Việt ngắn gọn.",
          ).then((t) => {
            setTip(t);
            setTipLoad(false);
          });
        }, []);

        const ask = async () => {
          if (!q.trim() || loading) return;
          setLoading(true);
          const sys = `Chuyên gia dinh dưỡng thể thao. Tiếng Việt ngắn gọn. Người dùng: mục tiêu ${profile.goal}, ${profile.conditions?.length ? "bệnh nền: " + profile.conditions.join(", ") : ""}, ${profile.days} buổi/tuần.`;
          const reply = await askAI([{ role: "user", content: q }], sys);
          setAns(reply);
          setLoading(false);
        };

        const addMeal = () => {
          if (!food.trim()) return;
          setMeals([...meals, { food, cals: parseInt(cals) || 0 }]);
          setFood("");
          setCals("");
        };
        const total = meals.reduce((s, m) => s + m.cals, 0);
        const QUICK_Q = [
          "Nên ăn gì trước khi tập?",
          "Protein bao nhiêu là đủ?",
          "Uống gì sau buổi tập?",
        ];

        if (view === "ask")
          return (
            <div
              style={{
                display: "flex",
                flexDirection: "column",
                height: "100%",
                padding: 16,
                overflowY: "auto",
              }}
            >
              <button
                onClick={() => {
                  setView("home");
                  setAns("");
                  setQ("");
                }}
                style={{
                  background: "none",
                  border: "none",
                  color: C.muted,
                  textAlign: "left",
                  marginBottom: 16,
                  fontSize: 14,
                }}
              >
                ← Quay lại
              </button>
              <h2
                style={{
                  fontFamily: "'Barlow Condensed',sans-serif",
                  fontSize: 26,
                  fontWeight: 800,
                  color: C.text,
                  marginBottom: 16,
                }}
              >
                HỎI CHUYÊN GIA
              </h2>
              <div
                style={{
                  display: "flex",
                  flexDirection: "column",
                  gap: 9,
                  marginBottom: 14,
                }}
              >
                {QUICK_Q.map((qq) => (
                  <button
                    key={qq}
                    onClick={() => setQ(qq)}
                    style={{
                      background: q === qq ? C.accent : C.card,
                      color: q === qq ? "#000" : C.muted,
                      border: `1px solid ${q === qq ? C.accent : C.border}`,
                      borderRadius: 10,
                      padding: "10px 14px",
                      fontSize: 13,
                      textAlign: "left",
                    }}
                  >
                    {qq}
                  </button>
                ))}
              </div>
              <textarea
                value={q}
                onChange={(e) => setQ(e.target.value)}
                placeholder="Hoặc nhập câu hỏi..."
                style={{ ...inputStyle, minHeight: 80, resize: "vertical" }}
              />
              <button
                onClick={ask}
                style={{
                  background: loading ? C.border : C.accent,
                  color: loading ? C.muted : "#000",
                  border: "none",
                  borderRadius: 12,
                  padding: "12px",
                  fontSize: 14,
                  fontWeight: 600,
                  marginTop: 12,
                }}
              >
                {loading ? "Đang xử lý..." : "Hỏi ngay →"}
              </button>
              {ans && (
                <div
                  style={{
                    background: C.card,
                    border: `1px solid ${C.border}`,
                    borderRadius: 12,
                    padding: 16,
                    marginTop: 16,
                    fontSize: 14,
                    color: C.text,
                    lineHeight: 1.7,
                    whiteSpace: "pre-wrap",
                  }}
                >
                  {ans}
                </div>
              )}
            </div>
          );

        if (view === "track")
          return (
            <div
              style={{
                display: "flex",
                flexDirection: "column",
                height: "100%",
                padding: 16,
                overflowY: "auto",
              }}
            >
              <button
                onClick={() => setView("home")}
                style={{
                  background: "none",
                  border: "none",
                  color: C.muted,
                  textAlign: "left",
                  marginBottom: 16,
                  fontSize: 14,
                }}
              >
                ← Quay lại
              </button>
              <div
                style={{
                  background: C.card,
                  border: `1.5px solid ${C.accent}`,
                  borderRadius: 16,
                  padding: "20px",
                  marginBottom: 16,
                  textAlign: "center",
                }}
              >
                <div
                  style={{
                    fontFamily: "'Barlow Condensed',sans-serif",
                    fontSize: 56,
                    fontWeight: 900,
                    color: C.accent,
                    lineHeight: 1,
                  }}
                >
                  {total}
                </div>
                <div style={{ color: C.muted, fontSize: 13, marginTop: 4 }}>
                  calo hôm nay
                </div>
              </div>
              <div style={{ display: "flex", gap: 8, marginBottom: 12 }}>
                <input
                  value={food}
                  onChange={(e) => setFood(e.target.value)}
                  placeholder="Tên món ăn"
                  style={{
                    flex: 2,
                    background: C.card,
                    border: `1px solid ${C.border}`,
                    borderRadius: 10,
                    padding: "10px 12px",
                    color: C.text,
                    fontSize: 13,
                  }}
                />
                <input
                  value={cals}
                  onChange={(e) => setCals(e.target.value)}
                  placeholder="Kcal"
                  type="number"
                  style={{
                    flex: 1,
                    background: C.card,
                    border: `1px solid ${C.border}`,
                    borderRadius: 10,
                    padding: "10px 12px",
                    color: C.text,
                    fontSize: 13,
                  }}
                />
                <button
                  onClick={addMeal}
                  style={{
                    background: C.accent,
                    color: "#000",
                    border: "none",
                    borderRadius: 10,
                    padding: "0 14px",
                    fontWeight: 700,
                    fontSize: 18,
                  }}
                >
                  +
                </button>
              </div>
              {meals.length === 0 && (
                <p
                  style={{
                    color: C.muted,
                    fontSize: 13,
                    textAlign: "center",
                    padding: "20px 0",
                  }}
                >
                  Chưa có bữa ăn nào.
                </p>
              )}
              {meals.map((m, i) => (
                <div
                  key={i}
                  style={{
                    background: C.surface,
                    border: `1px solid ${C.border}`,
                    borderRadius: 10,
                    padding: "10px 14px",
                    marginBottom: 8,
                    display: "flex",
                    justifyContent: "space-between",
                    alignItems: "center",
                  }}
                >
                  <span style={{ fontSize: 14, color: C.text }}>{m.food}</span>
                  <div
                    style={{ display: "flex", alignItems: "center", gap: 10 }}
                  >
                    <span
                      style={{ fontSize: 14, color: C.accent, fontWeight: 600 }}
                    >
                      {m.cals} kcal
                    </span>
                    <button
                      onClick={() => setMeals(meals.filter((_, j) => j !== i))}
                      style={{
                        background: "none",
                        border: "none",
                        color: C.muted,
                        fontSize: 16,
                        padding: 0,
                      }}
                    >
                      ×
                    </button>
                  </div>
                </div>
              ))}
            </div>
          );

        return (
          <div style={{ padding: 16, overflowY: "auto" }}>
            <h2
              style={{
                fontFamily: "'Barlow Condensed',sans-serif",
                fontSize: 24,
                fontWeight: 800,
                color: C.text,
                marginBottom: 4,
              }}
            >
              DINH DƯỠNG
            </h2>
            <p style={{ color: C.muted, fontSize: 13, marginBottom: 16 }}>
              Tối ưu chế độ ăn của bạn
            </p>
            <div
              style={{
                background: C.card,
                borderLeft: `3px solid ${C.accent}`,
                borderRadius: "0 12px 12px 0",
                padding: "12px 16px",
                marginBottom: 16,
              }}
            >
              <div
                style={{
                  fontSize: 10,
                  color: C.accent,
                  fontWeight: 600,
                  letterSpacing: "0.1em",
                  marginBottom: 6,
                }}
              >
                MẸO HÔM NAY
              </div>
              <p
                style={{
                  fontSize: 14,
                  color: tipLoad ? C.muted : C.text,
                  lineHeight: 1.6,
                }}
              >
                {tipLoad ? "Đang tải..." : tip}
              </p>
            </div>
            {[
              {
                view: "ask",
                icon: "🥗",
                title: "HỎI CHUYÊN GIA",
                sub: "Tư vấn dinh dưỡng cá nhân hóa với AI",
              },
              {
                view: "track",
                icon: "📊",
                title: "THEO DÕI CALO",
                sub: "Ghi lại bữa ăn và tổng calo trong ngày",
              },
            ].map((card) => (
              <button
                key={card.view}
                onClick={() => setView(card.view)}
                style={{
                  display: "block",
                  width: "100%",
                  background: C.card,
                  border: `1px solid ${C.border}`,
                  borderRadius: 16,
                  padding: "20px",
                  textAlign: "left",
                  marginBottom: 12,
                }}
              >
                <div style={{ fontSize: 32, marginBottom: 10 }}>
                  {card.icon}
                </div>
                <div
                  style={{
                    fontFamily: "'Barlow Condensed',sans-serif",
                    fontSize: 22,
                    fontWeight: 800,
                    color: C.text,
                  }}
                >
                  {card.title}
                </div>
                <div style={{ fontSize: 13, color: C.muted, marginTop: 5 }}>
                  {card.sub}
                </div>
              </button>
            ))}
          </div>
        );
      }

      // ════════════════════════════════════════════════════════════════
      // GOAL MODAL
      // ════════════════════════════════════════════════════════════════
      function GoalModal({ profile, onSave, onClose }) {
        const [goal, setGoal] = useState(profile.goal);
        const [days, setDays] = useState(profile.days);
        const [level, setLevel] = useState(profile.level);
        const goals = [
          { id: "giảm cân", icon: "🔥", label: "Giảm cân" },
          { id: "tăng cơ bắp", icon: "💪", label: "Tăng cơ bắp" },
          { id: "cải thiện thể lực", icon: "⚡", label: "Cải thiện thể lực" },
        ];
        const levels = [
          { id: "mới bắt đầu", label: "Mới bắt đầu" },
          { id: "trung bình", label: "Trung bình" },
          { id: "nâng cao", label: "Nâng cao" },
        ];

        return (
          <div
            style={{
              position: "fixed",
              inset: 0,
              background: "rgba(0,0,0,0.7)",
              display: "flex",
              alignItems: "flex-end",
              justifyContent: "center",
              zIndex: 999,
            }}
            onClick={onClose}
          >
            <div
              style={{
                background: C.surface,
                borderRadius: "20px 20px 0 0",
                border: `1px solid ${C.border}`,
                width: "100%",
                maxWidth: 430,
                padding: "24px 20px 36px",
              }}
              onClick={(e) => e.stopPropagation()}
            >
              <div
                style={{
                  display: "flex",
                  justifyContent: "space-between",
                  alignItems: "center",
                  marginBottom: 20,
                }}
              >
                <span
                  style={{
                    fontFamily: "'Barlow Condensed',sans-serif",
                    fontSize: 22,
                    fontWeight: 800,
                    color: C.text,
                  }}
                >
                  ĐỔI CHẾ ĐỘ TẬP
                </span>
                <button
                  onClick={onClose}
                  style={{
                    background: "none",
                    border: "none",
                    color: C.muted,
                    fontSize: 22,
                  }}
                >
                  ×
                </button>
              </div>
              <div
                style={{
                  fontSize: 11,
                  color: C.muted,
                  fontWeight: 600,
                  letterSpacing: "0.08em",
                  marginBottom: 8,
                }}
              >
                MỤC TIÊU
              </div>
              <div
                style={{
                  display: "flex",
                  flexDirection: "column",
                  gap: 8,
                  marginBottom: 18,
                }}
              >
                {goals.map((g) => (
                  <button
                    key={g.id}
                    onClick={() => setGoal(g.id)}
                    style={chip(goal === g.id, true)}
                  >
                    <span style={{ fontSize: 18 }}>{g.icon}</span>
                    {g.label}
                  </button>
                ))}
              </div>
              <div
                style={{
                  fontSize: 11,
                  color: C.muted,
                  fontWeight: 600,
                  letterSpacing: "0.08em",
                  marginBottom: 8,
                }}
              >
                SỐ BUỔI / TUẦN
              </div>
              <div style={{ display: "flex", gap: 8, marginBottom: 18 }}>
                {[3, 4, 5].map((d) => (
                  <button
                    key={d}
                    onClick={() => setDays(d)}
                    style={{
                      ...chip(days === d, true),
                      flex: 1,
                      justifyContent: "center",
                    }}
                  >
                    {d} buổi
                  </button>
                ))}
              </div>
              <div
                style={{
                  fontSize: 11,
                  color: C.muted,
                  fontWeight: 600,
                  letterSpacing: "0.08em",
                  marginBottom: 8,
                }}
              >
                TRÌNH ĐỘ
              </div>
              <div
                style={{
                  display: "flex",
                  flexDirection: "column",
                  gap: 8,
                  marginBottom: 24,
                }}
              >
                {levels.map((l) => (
                  <button
                    key={l.id}
                    onClick={() => setLevel(l.id)}
                    style={chip(level === l.id, true)}
                  >
                    {l.label}
                  </button>
                ))}
              </div>
              <button
                onClick={() => onSave({ ...profile, goal, days, level })}
                style={{
                  width: "100%",
                  padding: "14px",
                  background: C.accent,
                  color: "#000",
                  border: "none",
                  borderRadius: 12,
                  fontSize: 15,
                  fontWeight: 600,
                }}
              >
                Lưu thay đổi ✓
              </button>
            </div>
          </div>
        );
      }
      function ApiKeySetup({ onDone }) {
        const [key, setKey] = useState("");
        const saveKey = () => {
          if (key.trim().length > 20) {
            localStorage.setItem("GEMINI_API_KEY", key.trim());
            onDone();
          } else {
            alert("API Key có vẻ không hợp lệ. Vui lòng kiểm tra lại!");
          }
        };
        return (
          <div
            style={{
              minHeight: "100vh",
              background: C.bg,
              display: "flex",
              alignItems: "center",
              justifyContent: "center",
              padding: 24,
            }}
          >
            <div
              style={{
                width: "100%",
                maxWidth: 390,
                background: C.surface,
                border: `1px solid ${C.border}`,
                borderRadius: 20,
                padding: 24,
              }}
            >
              <h1
                style={{
                  fontFamily: "'Barlow Condensed',sans-serif",
                  fontSize: 32,
                  fontWeight: 900,
                  color: C.text,
                  marginBottom: 8,
                }}
              >
                🔑 CÀI ĐẶT <span style={{ color: C.accent }}>API KEY</span>
              </h1>
              <p
                style={{
                  color: C.muted,
                  fontSize: 13,
                  marginBottom: 24,
                  lineHeight: 1.6,
                }}
              >
                Để trải nghiệm không bị gián đoạn, vui lòng kết nối API Key
                Gemini của bạn. Key chỉ lưu an toàn trên máy bạn.
              </p>
              <div style={label}>DÁN API KEY VÀO ĐÂY</div>
              <input
                type="password"
                value={key}
                onChange={(e) => setKey(e.target.value)}
                placeholder="AIzaSy..."
                style={{ ...inputStyle, marginBottom: 12 }}
              />
              <a
                href="https://aistudio.google.com/app/apikey"
                target="_blank"
                rel="noreferrer"
                style={{
                  color: C.accent,
                  fontSize: 13,
                  textDecoration: "none",
                  fontWeight: 600,
                  display: "block",
                  marginBottom: 24,
                }}
              >
                👉 Bấm vào đây để lấy API Key miễn phí
              </a>
              <button
                onClick={saveKey}
                style={{ ...primBtn(key.length > 20), marginTop: 0 }}
              >
                Lưu & Bắt đầu trải nghiệm →
              </button>
            </div>
          </div>
        );
      }
      // ════════════════════════════════════════════════════════════════
      // ROOT APP
      // ════════════════════════════════════════════════════════════════
      function App() {
        // 1. Kiểm tra API Key và các State khởi tạo
        const [hasKey, setHasKey] = useState(
          !!localStorage.getItem("GEMINI_API_KEY"),
        );
        const [screen, setScreen] = useState("disclaimer"); // disclaimer | onboarding | app
        const [profile, setProfile] = useState(null);
        const [tab, setTab] = useState("chat");
        const [showModal, setShowModal] = useState(false);

        // ── Persistent state — giữ nguyên khi đổi tab ──
        const [chatMsgs, setChatMsgs] = useState(null); // null = chưa khởi tạo
        const [schedule, setSchedule] = useState(null); // lịch tập đã tạo

        const TABS = [
          { id: "chat", icon: "💬", label: "Chat" },
          { id: "schedule", icon: "📅", label: "Lịch tập" },
          { id: "checkin", icon: "❤️", label: "Check-in" },
          { id: "nutrition", icon: "🥗", label: "Dinh dưỡng" },
        ];

        // 2. Điều hướng các màn hình lúc mới vào web
        if (!hasKey) return <ApiKeySetup onDone={() => setHasKey(true)} />;
        if (screen === "disclaimer")
          return <Disclaimer onAgree={() => setScreen("onboarding")} />;
        if (screen === "onboarding")
          return (
            <Onboarding
              onDone={(p) => {
                setProfile(p);
                setScreen("app");
              }}
            />
          );

        // 3. Giao diện chính của App
        return (
          <div
            style={{
              background: C.bg,
              minHeight: "100vh",
              display: "flex",
              justifyContent: "center",
            }}
          >
            <div
              style={{
                width: "100%",
                maxWidth: 430,
                background: C.bg,
                display: "flex",
                flexDirection: "column",
                height: "100vh",
              }}
            >
              {/* Modal Đổi Mục Tiêu */}
              {showModal && (
                <GoalModal
                  profile={profile}
                  onSave={(p) => {
                    setProfile(p);
                    setShowModal(false);
                    setTab("chat");
                  }}
                  onClose={() => setShowModal(false)}
                />
              )}

              {/* Header */}
              <div
                style={{
                  background: C.surface,
                  borderBottom: `1px solid ${C.border}`,
                  padding: "13px 20px",
                  display: "flex",
                  justifyContent: "space-between",
                  alignItems: "center",
                  flexShrink: 0,
                }}
              >
                <div>
                  <div
                    style={{
                      fontFamily: "'Barlow Condensed',sans-serif",
                      fontSize: 22,
                      fontWeight: 900,
                      color: C.text,
                    }}
                  >
                    AI GYM <span style={{ color: C.accent }}>COACH</span>
                  </div>
                  <div style={{ fontSize: 11, color: C.muted, marginTop: 1 }}>
                    Xin chào, {profile.name} 👋
                    {profile.conditions?.length > 0 && (
                      <span style={{ color: C.warn, marginLeft: 6 }}>⚕️</span>
                    )}
                  </div>
                </div>
                <button
                  onClick={() => setShowModal(true)}
                  style={{
                    background: C.card,
                    border: `1px solid ${C.accent}`,
                    borderRadius: 20,
                    padding: "4px 12px",
                    fontSize: 11,
                    color: C.accent,
                    fontWeight: 600,
                    cursor: "pointer",
                    display: "flex",
                    alignItems: "center",
                    gap: 5,
                  }}
                >
                  {profile.goal}{" "}
                  <span style={{ fontSize: 10, opacity: 0.7 }}>✏️</span>
                </button>
              </div>

              {/* Content (Các Tab) */}
              <div
                style={{
                  flex: 1,
                  overflow: "hidden",
                  display: "flex",
                  flexDirection: "column",
                }}
              >
                <div
                  style={{
                    display: tab === "chat" ? "flex" : "none",
                    flexDirection: "column",
                    height: "100%",
                    overflow: "hidden",
                  }}
                >
                  {profile && (
                    <Chat
                      profile={profile}
                      initMsgs={chatMsgs}
                      onMsgsChange={setChatMsgs}
                    />
                  )}
                </div>
                <div
                  style={{
                    display: tab === "schedule" ? "flex" : "none",
                    flexDirection: "column",
                    height: "100%",
                    overflow: "hidden",
                  }}
                >
                  {profile && (
                    <Schedule
                      profile={profile}
                      savedPlan={schedule}
                      onPlanChange={setSchedule}
                    />
                  )}
                </div>
                <div
                  style={{
                    display: tab === "checkin" ? "flex" : "none",
                    flexDirection: "column",
                    height: "100%",
                    overflow: "hidden",
                  }}
                >
                  {profile && <HealthCheckin profile={profile} />}
                </div>
                <div
                  style={{
                    display: tab === "nutrition" ? "flex" : "none",
                    flexDirection: "column",
                    height: "100%",
                    overflow: "hidden",
                  }}
                >
                  {profile && <Nutrition profile={profile} />}
                </div>
              </div>

              {/* Bottom Nav */}
              <div
                style={{
                  background: C.surface,
                  borderTop: `1px solid ${C.border}`,
                  display: "flex",
                  flexShrink: 0,
                }}
              >
                {TABS.map((t) => (
                  <button
                    key={t.id}
                    onClick={() => setTab(t.id)}
                    style={{
                      flex: 1,
                      background: "none",
                      border: "none",
                      padding: "10px 0 7px",
                      display: "flex",
                      flexDirection: "column",
                      alignItems: "center",
                      gap: 2,
                    }}
                  >
                    <span style={{ fontSize: 18 }}>{t.icon}</span>
                    <span
                      style={{
                        fontSize: 9,
                        fontWeight: 500,
                        color: tab === t.id ? C.accent : C.muted,
                      }}
                    >
                      {t.label}
                    </span>
                    {tab === t.id && (
                      <div
                        style={{
                          width: 16,
                          height: 2,
                          background: C.accent,
                          borderRadius: 1,
                        }}
                      />
                    )}
                  </button>
                ))}
              </div>
            </div>
          </div>
        );
      }

      ReactDOM.createRoot(document.getElementById("root")).render(<App />);
    </script>
  </body>
</html>
